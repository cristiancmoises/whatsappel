[package]
name = "pqenv"
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Post-quantum message envelope + forward-secure ratchet (ML-KEM-1024 + ML-DSA-87 + ChaCha20-Poly1305) for whatsappel"

[[bin]]
name = "pqenv"
path = "src/main.rs"

[dependencies]
libcrux-ml-kem = "0.0.9"
libcrux-ml-dsa = "0.0.9"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
getrandom = "0.2"
base64 = "0.22"

[profile.release]
opt-level = 3

[dev-dependencies]
proptest = "1"
